<!DOCTYPE html>
<html lang="eo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Weeks Ago — a card catalog for new Wikipedia articles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ledger:#1B2A3A;
    --ledger-deep:#12202D;
    --card:#E8DCC3;
    --card-line:#c9bb99;
    --ink:#211D1A;
    --ink-soft:#5b5347;
    --stamp:#A13424;
    --gold:#C99A3B;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,154,59,0.08), transparent 60%),
      var(--ledger);
    background-color:var(--ledger);
    color:var(--card);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 80px;
  }
  .drawer-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(201,154,59,0.4);
    padding:6px 14px;
    border-radius:2px;
    margin-bottom:18px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px, 4vw, 40px);
    margin:0 0 6px;
    text-align:center;
    letter-spacing:-0.01em;
  }
  .sub{
    font-family:var(--sans);
    color:#9fb0bf;
    font-size:14px;
    margin:0 0 34px;
    text-align:center;
    max-width:440px;
    line-height:1.5;
  }
  .anchor-line{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.04em;
    color:var(--gold);
    text-align:center;
    margin:0 0 22px;
  }
  .anchor-line b{
    color:var(--card);
    font-weight:600;
  }
  .controls{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .range-line{
    font-family:var(--mono);
    font-size:11.5px;
    color:#9fb0bf;
    text-align:center;
    margin:0 0 30px;
    min-height:14px;
    max-width:440px;
    line-height:1.6;
  }
  .range-line b{
    color:var(--gold);
    font-weight:600;
  }
  .range-line .widened{
    color:#7c8e9c;
  }
  select{
    font-family:var(--mono);
    font-size:13px;
    background:var(--ledger-deep);
    color:var(--card);
    border:1px solid rgba(255,255,255,0.15);
    padding:10px 12px;
    border-radius:2px;
    cursor:pointer;
  }
  button.dig{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--gold);
    color:var(--ledger-deep);
    border:none;
    padding:11px 20px;
    border-radius:2px;
    cursor:pointer;
    font-weight:600;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  button.dig:hover{ background:#dcae4c; }
  button.dig:active{ transform:scale(0.97); }
  button.dig:disabled{ opacity:0.5; cursor:default; transform:none; }
  button.dig:focus-visible, select:focus-visible{
    outline:2px solid var(--card);
    outline-offset:2px;
  }

  .stage{ width:100%; max-width:560px; min-height:340px; display:flex; align-items:flex-start; justify-content:center; }

  .placeholder{
    color:#6d818f;
    font-family:var(--mono);
    font-size:13px;
    text-align:center;
    margin-top:60px;
    line-height:1.7;
  }

  .card{
    position:relative;
    width:100%;
    background:var(--card);
    color:var(--ink);
    border-radius:2px;
    box-shadow:0 24px 48px rgba(0,0,0,0.35), 0 2px 0 rgba(0,0,0,0.1);
    padding:34px 30px 28px;
    animation:rise 0.45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid var(--card-line);
    pointer-events:none;
  }
  .stamp{
    position:absolute;
    top:18px; right:22px;
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    color:var(--stamp);
    border:1.5px solid var(--stamp);
    border-radius:3px;
    padding:5px 9px;
    transform:rotate(4deg);
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:rgba(161,52,36,0.04);
  }
  .field{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .title{
    font-family:var(--serif);
    font-weight:600;
    font-size:26px;
    line-height:1.2;
    margin:0 0 16px;
    padding-right:90px;
  }
  .thumb{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:1px;
    margin-bottom:16px;
    border:1px solid var(--card-line);
  }
  .extract{
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
    margin:0 0 20px;
  }
  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px dashed var(--card-line);
    padding-top:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  a.open{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    padding-bottom:1px;
  }
  a.open:hover{ color:var(--stamp); border-color:var(--stamp); }

  .meta-group{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .wd-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:3px;
    text-decoration:none;
    line-height:1.4;
  }
  .wd-badge.linked{
    color:#2b5f3a;
    border:1px solid #2b5f3a;
    background:rgba(43,95,58,0.06);
  }
  .wd-badge.linked:hover{ background:rgba(43,95,58,0.14); }
  .wd-badge.unlinked{
    color:var(--ink-soft);
    border:1px solid var(--card-line);
    background:rgba(0,0,0,0.02);
  }
  .list-row .wd-badge{
    margin-top:4px;
  }

  .error{
    color:#e9c4bb;
    font-family:var(--mono);
    font-size:13px;
    text-align:center;
    margin-top:60px;
    line-height:1.7;
    max-width:400px;
  }
  .spinner{
    margin-top:70px;
    width:22px; height:22px;
    border:2px solid rgba(255,255,255,0.15);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .stage.wide{ max-width:640px; }

  .list-card{
    position:relative;
    width:100%;
    background:var(--card);
    color:var(--ink);
    border-radius:2px;
    box-shadow:0 24px 48px rgba(0,0,0,0.35), 0 2px 0 rgba(0,0,0,0.1);
    padding:26px 8px 10px;
    animation:rise 0.45s cubic-bezier(.2,.8,.2,1);
  }
  .list-card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid var(--card-line);
    pointer-events:none;
  }
  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 24px 16px;
  }
  .list-head .field{ margin-bottom:0; }
  .list-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .list-rows{
    list-style:none;
    margin:0;
    padding:0 8px 8px;
    max-height:60vh;
    overflow-y:auto;
  }
  .list-row{
    display:flex;
    align-items:baseline;
    gap:12px;
    padding:11px 16px;
    border-top:1px dashed var(--card-line);
  }
  .list-row:first-child{ border-top:none; }
  .list-index{
    font-family:var(--mono);
    font-size:11px;
    color:var(--stamp);
    width:20px;
    flex-shrink:0;
  }
  .list-body{ flex:1; min-width:0; }
  .list-title-link{
    font-family:var(--serif);
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    text-decoration:none;
    display:block;
  }
  .list-title-link:hover{ color:var(--stamp); }
  .list-date{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    margin-top:2px;
  }
</style>
</head>
<body>

  <div class="drawer-label">Recent Accessions Drawer</div>
  <h1>Three Weeks Ago</h1>
  <p class="sub">Pull a random article that was added into Wikipedia around three weeks back - new articles after the initial edits and discussions.</p>

  <div class="anchor-line" id="anchorLine"></div>

  <div class="controls">
    <select id="lang" aria-label="Wikipedia language edition">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="eo" selected>Esperanto</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="it">Italiano</option>
      <option value="nl">Nederlands</option>
      <option value="pl">Polski</option>
      <option value="pt">Português</option>
      <option value="ja">日本語</option>
    </select>
    <select id="rangeWidth" aria-label="Date range width">
      <option value="0">Only that date</option>
      <option value="1">±1 day</option>
      <option value="2" selected>±2 days</option>
      <option value="3">±3 days</option>
      <option value="7">±7 days</option>
    </select>
    <button class="dig" id="digBtn">Random article</button>
    <button class="dig" id="listBtn">Give me a list</button>
  </div>

  <div class="range-line" id="rangeLine"></div>

  <div class="stage" id="stage">
    <p class="placeholder">Choose an edition and pull the drawer.<br>Nothing filed yet.</p>
  </div>

<script>
const API = (lang) => `https://${lang}.wikipedia.org/w/api.php`;
const stage = document.getElementById('stage');
const btn = document.getElementById('digBtn');
const listBtn = document.getElementById('listBtn');
const langSel = document.getElementById('lang');
const rangeWidthSel = document.getElementById('rangeWidth');
const rangeLine = document.getElementById('rangeLine');
const anchorLine = document.getElementById('anchorLine');

// Every window is anchored on the calendar date "21 days ago" (three weeks),
// aligned to UTC midnight. The picker chooses how many days on either side of
// that date to include (0 = that date only); if that width turns up nothing,
// we escalate to the next wider option in the list rather than giving up.
const CENTER_DAYS_AGO = 21;
const RANGE_OPTIONS = [0, 1, 2, 3, 7];

function anchorMidnightUTC(){
  const d = new Date();
  d.setUTCHours(0, 0, 0, 0);
  d.setUTCDate(d.getUTCDate() - CENTER_DAYS_AGO);
  return d;
}

function widthToWindow(width){
  const anchor = anchorMidnightUTC();
  const start = new Date(anchor);
  start.setUTCDate(start.getUTCDate() - width);
  const endExclusive = new Date(anchor);
  endExclusive.setUTCDate(endExclusive.getUTCDate() + width + 1);
  const displayEnd = new Date(anchor);
  displayEnd.setUTCDate(displayEnd.getUTCDate() + width);
  return { start, endExclusive, displayStart: start, displayEnd, width };
}

async function getCandidates(lang, selectedWidth){
  const startIdx = Math.max(0, RANGE_OPTIONS.indexOf(selectedWidth));
  let candidates = [];
  let usedWindow = widthToWindow(RANGE_OPTIONS[startIdx]);
  let widened = false;
  for(let i = startIdx; i < RANGE_OPTIONS.length; i++){
    const w = widthToWindow(RANGE_OPTIONS[i]);
    candidates = await fetchNewPagesWindow(lang, w.start, w.endExclusive);
    usedWindow = w;
    widened = i > startIdx;
    if(candidates.length > 0) break;
  }
  return { candidates, window: usedWindow, widened };
}

function fmtRangeBoundary(d){
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function renderAnchorLine(){
  anchorLine.innerHTML = `Three weeks ago: <b>${fmtRangeBoundary(anchorMidnightUTC())}</b>`;
}
renderAnchorLine();

function renderRangeLine(window, widened){
  const start = fmtRangeBoundary(window.displayStart);
  const end = fmtRangeBoundary(window.displayEnd);
  const rangeText = start === end
    ? `Created on <b>${start}</b>`
    : `Created between <b>${start}</b> and <b>${end}</b>`;
  const note = widened ? ` <span class="widened">(widened — the picked range was empty)</span>` : '';
  rangeLine.innerHTML = rangeText + note;
}

async function fetchNewPagesWindow(lang, startDate, endExclusiveDate){
  const rcend = startDate.toISOString();        // earlier boundary
  const rcstart = endExclusiveDate.toISOString(); // later boundary
  const params = new URLSearchParams({
    action: 'query',
    list: 'recentchanges',
    rcnamespace: '0',
    rctype: 'new',
    rcshow: '!redirect',
    rcprop: 'title|timestamp|ids',
    rcstart, rcend,
    rcdir: 'older',
    rclimit: '500',
    format: 'json',
    origin: '*'
  });
  const res = await fetch(`${API(lang)}?${params}`);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  return data.query ? data.query.recentchanges : [];
}

async function fetchExtract(lang, pageid){
  const params = new URLSearchParams({
    action: 'query',
    prop: 'extracts|pageimages|info|pageprops',
    exintro: '1',
    explaintext: '1',
    exsentences: '5',
    piprop: 'thumbnail',
    pithumbsize: '500',
    ppprop: 'wikibase_item',
    inprop: 'url',
    pageids: pageid,
    format: 'json',
    origin: '*'
  });
  const res = await fetch(`${API(lang)}?${params}`);
  const data = await res.json();
  return data.query.pages[pageid];
}

// Batch-fetch wikidata item ids for a list of pageids (chunked, since the API
// caps the number of pageids per request for non-bot accounts).
async function fetchWikidataMap(lang, pageids){
  const map = {};
  const chunkSize = 50;
  for(let i = 0; i < pageids.length; i += chunkSize){
    const chunk = pageids.slice(i, i + chunkSize);
    const params = new URLSearchParams({
      action: 'query',
      prop: 'pageprops',
      ppprop: 'wikibase_item',
      pageids: chunk.join('|'),
      format: 'json',
      origin: '*'
    });
    try {
      const res = await fetch(`${API(lang)}?${params}`);
      const data = await res.json();
      if(data.query && data.query.pages){
        for(const pid in data.query.pages){
          const pg = data.query.pages[pid];
          map[pid] = (pg.pageprops && pg.pageprops.wikibase_item) || null;
        }
      }
    } catch(e){
      // leave this chunk unmapped rather than failing the whole list
    }
  }
  return map;
}

function wdBadgeHtml(qid){
  return qid
    ? `<a class="wd-badge linked" href="https://www.wikidata.org/wiki/${qid}" target="_blank" rel="noopener">⬡ Wikidata ${qid}</a>`
    : `<span class="wd-badge unlinked">⬡ no Wikidata item</span>`;
}

function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function setBusy(isBusy){
  btn.disabled = isBusy;
  listBtn.disabled = isBusy;
}

function noResultsMessage(){
  return `<p class="error">No new articles turned up for this edition around three weeks ago. Smaller wikis sometimes have quiet stretches — try again, or switch editions.</p>`;
}

function pageUrl(lang, title){
  return `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g,'_'))}`;
}

async function dig(){
  const lang = langSel.value;
  setBusy(true);
  stage.className = 'stage';
  stage.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';
  rangeLine.innerHTML = '';

  try {
    const selectedWidth = parseInt(rangeWidthSel.value, 10);
    const { candidates, window, widened } = await getCandidates(lang, selectedWidth);
    renderRangeLine(window, widened);
    if(candidates.length === 0){
      stage.innerHTML = noResultsMessage();
      return;
    }

    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    const page = await fetchExtract(lang, pick.pageid);

    const thumb = page.thumbnail
      ? `<img class="thumb" src="${page.thumbnail.source}" alt="">`
      : '';
    const extract = (page.extract || 'No summary available.').trim();
    const url = page.fullurl || pageUrl(lang, page.title);
    const qid = page.pageprops && page.pageprops.wikibase_item;

    stage.innerHTML = `
      <div class="card">
        <div class="stamp">Created ${fmtDate(pick.timestamp)}</div>
        <div class="field">${lang}.wikipedia.org — new article</div>
        <h2 class="title">${page.title}</h2>
        ${thumb}
        <p class="extract">${extract}</p>
        <div class="footer-row">
          <div class="meta-group">
            <span class="meta">page id ${page.pageid}</span>
            ${wdBadgeHtml(qid)}
          </div>
          <a class="open" href="${url}" target="_blank" rel="noopener">Read the full article →</a>
        </div>
      </div>
    `;
  } catch(err){
    stage.innerHTML = `<p class="error">Couldn't reach Wikipedia's archive just now. Check your connection and try again.</p>`;
  } finally {
    setBusy(false);
  }
}

async function listTwenty(){
  const lang = langSel.value;
  setBusy(true);
  stage.className = 'stage wide';
  stage.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';
  rangeLine.innerHTML = '';

  try {
    const selectedWidth = parseInt(rangeWidthSel.value, 10);
    const { candidates, window, widened } = await getCandidates(lang, selectedWidth);
    renderRangeLine(window, widened);
    if(candidates.length === 0){
      stage.innerHTML = noResultsMessage();
      return;
    }

    const picks = [...candidates].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const wdMap = await fetchWikidataMap(lang, picks.map(p => p.pageid));

    const rows = picks.map((p, i) => `
      <li class="list-row">
        <span class="list-index">${String(i + 1).padStart(2,'0')}</span>
        <div class="list-body">
          <a class="list-title-link" href="${pageUrl(lang, p.title)}" target="_blank" rel="noopener">${p.title}</a>
          <div class="list-date">created ${fmtDate(p.timestamp)}</div>
          ${wdBadgeHtml(wdMap[p.pageid])}
        </div>
      </li>
    `).join('');

    stage.innerHTML = `
      <div class="list-card">
        <div class="list-head">
          <span class="field">${lang}.wikipedia.org — new articles</span>
          <span class="list-count">${picks.length} found</span>
        </div>
        <ul class="list-rows">${rows}</ul>
      </div>
    `;
  } catch(err){
    stage.innerHTML = `<p class="error">Couldn't reach Wikipedia's archive just now. Check your connection and try again.</p>`;
  } finally {
    setBusy(false);
  }
}

btn.addEventListener('click', dig);
listBtn.addEventListener('click', listTwenty);
</script>
</body>
</html>
