<!DOCTYPE html>
<html lang="eo"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Weeks Ago — a card catalog for new Wikipedia articles</title>
<style>
  :root{
    --ledger:#1B2A3A;
    --ledger-deep:#12202D;
    --card:#E8DCC3;
    --card-line:#c9bb99;
    --ink:#211D1A;
    --ink-soft:#5b5347;
    --stamp:#A13424;
    --gold:#C99A3B;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,154,59,0.08), transparent 60%),
      var(--ledger);
    background-color:var(--ledger);
    color:var(--card);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 80px;
  }
  .drawer-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(201,154,59,0.4);
    padding:6px 14px;
    border-radius:2px;
    margin-bottom:18px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px, 4vw, 40px);
    margin:0 0 6px;
    text-align:center;
    letter-spacing:-0.01em;
  }
  .sub{
    font-family:var(--sans);
    color:#9fb0bf;
    font-size:14px;
    margin:0 0 34px;
    text-align:center;
    max-width:440px;
    line-height:1.5;
  }
  .anchor-line{
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:0.04em;
    color:var(--gold);
    text-align:center;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .anchor-line b{
    color:var(--card);
    font-weight:600;
  }
  .anchor-line .anchor-sep{
    color:#6d818f;
  }
  .anchor-line select{
    font-size:12px;
    padding:7px 10px;
  }
  .custom-range-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:0 0 22px;
    flex-wrap:wrap;
  }
  .controls{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:18px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .range-line{
    font-family:var(--mono);
    font-size:11.5px;
    color:#9fb0bf;
    text-align:center;
    margin:0 0 30px;
    min-height:14px;
    max-width:440px;
    line-height:1.6;
  }
  .range-line b{
    color:var(--gold);
    font-weight:600;
  }
  .range-line .widened{
    color:#7c8e9c;
  }
  select{
    font-family:var(--mono);
    font-size:13px;
    background:var(--ledger-deep);
    color:var(--card);
    border:1px solid rgba(255,255,255,0.15);
    padding:10px 12px;
    border-radius:2px;
    cursor:pointer;
  }
  select:disabled{ opacity:0.4; cursor:default; }

  .sep-word{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#6d818f;
  }
  .custom-range{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--ledger-deep);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:2px;
    padding:4px 6px;
  }
  .custom-range input[type="date"]{
    font-family:var(--mono);
    font-size:12.5px;
    background:transparent;
    color:var(--card);
    border:none;
    padding:6px 4px;
    cursor:pointer;
    color-scheme:dark;
  }
  .custom-range input[type="date"]:focus-visible{
    outline:2px solid var(--card);
    outline-offset:2px;
    border-radius:2px;
  }
  .custom-range .to-sep{
    color:#6d818f;
    font-family:var(--mono);
    font-size:12px;
  }
  .custom-range .clear-custom{
    background:none;
    border:none;
    color:#6d818f;
    font-family:var(--mono);
    font-size:13px;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
    border-radius:2px;
  }
  .custom-range .clear-custom:hover{ color:var(--card); }
  .custom-range .clear-custom:focus-visible{
    outline:2px solid var(--card);
    outline-offset:1px;
  }
  .custom-range.active{
    border-color:var(--gold);
  }
  button.dig{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--gold);
    color:var(--ledger-deep);
    border:none;
    padding:11px 20px;
    border-radius:2px;
    cursor:pointer;
    font-weight:600;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  button.dig:hover{ background:#dcae4c; }
  button.dig:active{ transform:scale(0.97); }
  button.dig:disabled{ opacity:0.5; cursor:default; transform:none; }
  button.dig:focus-visible, select:focus-visible{
    outline:2px solid var(--card);
    outline-offset:2px;
  }

  .stage{ width:100%; max-width:560px; min-height:340px; display:flex; align-items:flex-start; justify-content:center; }

  .placeholder{
    color:#6d818f;
    font-family:var(--mono);
    font-size:13px;
    text-align:center;
    margin-top:60px;
    line-height:1.7;
  }

  .card{
    position:relative;
    width:100%;
    background:var(--card);
    color:var(--ink);
    border-radius:2px;
    box-shadow:0 24px 48px rgba(0,0,0,0.35), 0 2px 0 rgba(0,0,0,0.1);
    padding:34px 30px 28px;
    animation:rise 0.45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid var(--card-line);
    pointer-events:none;
  }
  .stamp{
    position:absolute;
    top:18px; right:22px;
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    color:var(--stamp);
    border:1.5px solid var(--stamp);
    border-radius:3px;
    padding:5px 9px;
    transform:rotate(4deg);
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:rgba(161,52,36,0.04);
  }
  .field{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .title{
    font-family:var(--serif);
    font-weight:600;
    font-size:26px;
    line-height:1.2;
    margin:0 0 16px;
    padding-right:90px;
  }
  .thumb{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:1px;
    margin-bottom:16px;
    border:1px solid var(--card-line);
  }
  .extract{
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
    margin:0 0 20px;
  }
  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px dashed var(--card-line);
    padding-top:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  a.open{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    padding-bottom:1px;
  }
  a.open:hover{ color:var(--stamp); border-color:var(--stamp); }

  .meta-group{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .wd-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:3px;
    text-decoration:none;
    line-height:1.4;
  }
  .wd-badge.linked{
    color:#2b5f3a;
    border:1px solid #2b5f3a;
    background:rgba(43,95,58,0.06);
  }
  .wd-badge.linked:hover{ background:rgba(43,95,58,0.14); }
  .wd-badge.unlinked{
    color:var(--ink-soft);
    border:1px solid var(--card-line);
    background:rgba(0,0,0,0.02);
  }
  .list-row .wd-badge{
    margin-top:4px;
  }

  .review-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:3px;
    line-height:1.4;
  }
  .review-badge.reviewed{
    color:#2b5f3a;
    border:1px solid #2b5f3a;
    background:rgba(43,95,58,0.06);
  }
  .review-badge.pending{
    color:#8a5a12;
    border:1px solid #8a5a12;
    background:rgba(138,90,18,0.08);
  }
  .review-badge.unreviewed{
    color:var(--stamp);
    border:1px solid var(--stamp);
    background:rgba(161,52,36,0.06);
  }
  .badge-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:4px;
  }
  .badge-row .wd-badge{ margin-top:0; }

  .filter-line .review-filter{
    display:none;
    align-items:center;
    gap:6px;
  }
  .filter-line .review-filter.visible{ display:inline-flex; }
  .filter-line .review-filter label{
    cursor:default;
  }
  .filter-line .review-filter select{
    font-size:11.5px;
    padding:6px 8px;
  }

  .error{
    color:#e9c4bb;
    font-family:var(--mono);
    font-size:13px;
    text-align:center;
    margin-top:60px;
    line-height:1.7;
    max-width:400px;
  }
  .spinner{
    margin-top:70px;
    width:22px; height:22px;
    border:2px solid rgba(255,255,255,0.15);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .stage.wide{ max-width:640px; }

  .filter-line{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:-8px 0 18px;
  }
  .filter-line.visible{ display:flex; }
  .filter-line label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:var(--mono);
    font-size:12px;
    color:#c7d2da;
    cursor:pointer;
    user-select:none;
  }
  .filter-line input[type="checkbox"]{
    width:14px; height:14px;
    accent-color:var(--gold);
    cursor:pointer;
  }

  .list-card{
    position:relative;
    width:100%;
    background:var(--card);
    color:var(--ink);
    border-radius:2px;
    box-shadow:0 24px 48px rgba(0,0,0,0.35), 0 2px 0 rgba(0,0,0,0.1);
    padding:26px 8px 10px;
    animation:rise 0.45s cubic-bezier(.2,.8,.2,1);
  }
  .list-card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid var(--card-line);
    pointer-events:none;
  }
  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 24px 16px;
  }
  .list-head .field{ margin-bottom:0; }
  .list-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .list-note{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    padding:0 24px 14px;
    margin-top:-8px;
  }
  .list-rows{
    list-style:none;
    margin:0;
    padding:0 8px 8px;
    max-height:60vh;
    overflow-y:auto;
  }
  .list-row{
    display:flex;
    align-items:baseline;
    gap:12px;
    padding:11px 16px;
    border-top:1px dashed var(--card-line);
  }
  .list-row:first-child{ border-top:none; }
  .list-index{
    font-family:var(--mono);
    font-size:11px;
    color:var(--stamp);
    width:20px;
    flex-shrink:0;
  }
  .list-body{ flex:1; min-width:0; }
  .list-title-link{
    font-family:var(--serif);
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    text-decoration:none;
    display:block;
  }
  .list-title-link:hover{ color:var(--stamp); }
  .list-date{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    margin-top:2px;
  }

  .site-footer{
    margin-top:40px;
    text-align:center;
  }
  .site-footer a{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.04em;
    color:#7c8e9c;
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .site-footer a:hover{
    color:var(--gold);
    border-bottom-color:var(--gold);
  }
</style>
</head>

  <p class="sub">Check articles a while after

      <option value="0">Only that date</option>
      <option value="1">±1 day</option>

<script>
const API = (lang) => `https://${lang}.wikipedia.org/w/api.php`;
const stage = document.getElementById('stage');
const btn = document.getElementById('digBtn');
const listBtn = document.getElementById('listBtn');
const langSel = document.getElementById('lang');
const rangeWidthSel = document.getElementById('rangeWidth');
const rangeLine = document.getElementById('rangeLine');
const anchorText = document.getElementById('anchorText');
const filterLine = document.getElementById('filterLine');
const noWikidataOnly = document.getElementById('noWikidataOnly');
const reviewFilterWrap = document.getElementById('reviewFilterWrap');
const reviewFilterSel = document.getElementById('reviewFilter');
const customRangeBox = document.getElementById('customRange');
const customStart = document.getElementById('customStart');
const customEnd = document.getElementById('customEnd');
const clearCustomBtn = document.getElementById('clearCustom');

// Holds the most recent list-view results so the checkbox can re-render
// without refetching from the API.
let lastListState = null;

// Every window is anchored on the calendar date "21 days ago" (three weeks),
// aligned to UTC midnight. The picker chooses how many days on either side of
// that date to include (0 = that date only); if that width turns up nothing,
// we escalate to the next wider option in the list rather than giving up.
const CENTER_DAYS_AGO = 21;
const RANGE_OPTIONS = [0, 1, 2, 3, 7];

function anchorMidnightUTC(){
  const d = new Date();
  d.setUTCHours(0, 0, 0, 0);
  d.setUTCDate(d.getUTCDate() - CENTER_DAYS_AGO);
  return d;
}

function widthToWindow(width){
  const anchor = anchorMidnightUTC();
  const start = new Date(anchor);
  start.setUTCDate(start.getUTCDate() - width);
  const endExclusive = new Date(anchor);
  endExclusive.setUTCDate(endExclusive.getUTCDate() + width + 1);
  const displayEnd = new Date(anchor);
  displayEnd.setUTCDate(displayEnd.getUTCDate() + width);
  return { start, endExclusive, displayStart: start, displayEnd, width };
}

// Parses the two <input type="date"> fields into a window, provided both
// are filled in. Dates are interpreted as UTC midnight, same as the anchor
// logic above, so the two modes stay consistent. If the fields are reversed
// (end before start) they're swapped rather than treated as an error.
function customRangeFromInputs(){
  const startVal = customStart.value;
  const endVal = customEnd.value;
  if(!startVal || !endVal) return null;
  let s = new Date(startVal + 'T00:00:00Z');
  let e = new Date(endVal + 'T00:00:00Z');
  if(isNaN(s) || isNaN(e)) return null;
  if(s > e){ const tmp = s; s = e; e = tmp; }
  const endExclusive = new Date(e);
  endExclusive.setUTCDate(endExclusive.getUTCDate() + 1);
  return { start: s, endExclusive, displayStart: s, displayEnd: e, width: null };
}

function syncRangeControls(){
  const active = !!customRangeFromInputs();
  rangeWidthSel.disabled = active;
  customRangeBox.classList.toggle('active', active);
}

async function getCandidates(lang, selectedWidth){
  const custom = customRangeFromInputs();
  if(custom){
    const candidates = await fetchNewPagesWindow(lang, custom.start, custom.endExclusive);
    return { candidates, window: custom, widened: false };
  }

  const startIdx = Math.max(0, RANGE_OPTIONS.indexOf(selectedWidth));
  let candidates = [];
  let usedWindow = widthToWindow(RANGE_OPTIONS[startIdx]);
  let widened = false;
  for(let i = startIdx; i < RANGE_OPTIONS.length; i++){
    const w = widthToWindow(RANGE_OPTIONS[i]);
    candidates = await fetchNewPagesWindow(lang, w.start, w.endExclusive);
    usedWindow = w;
    widened = i > startIdx;
    if(candidates.length > 0) break;
  }
  return { candidates, window: usedWindow, widened };
}

function fmtRangeBoundary(d){
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function renderAnchorLine(){
  anchorText.innerHTML = `Three weeks ago: <b>${fmtRangeBoundary(anchorMidnightUTC())}</b>`;
}
renderAnchorLine();

function renderRangeLine(window, widened){
  const start = fmtRangeBoundary(window.displayStart);
  const end = fmtRangeBoundary(window.displayEnd);
  const rangeText = start === end
    ? `Created on <b>${start}</b>`
    : `Created between <b>${start}</b> and <b>${end}</b>`;
  const note = widened ? ` <span class="widened">(widened — the picked range was empty)</span>` : '';
  rangeLine.innerHTML = rangeText + note;
}

async function fetchNewPagesWindow(lang, startDate, endExclusiveDate){
  const rcend = startDate.toISOString();        // earlier boundary
  const rcstart = endExclusiveDate.toISOString(); // later boundary
  const params = new URLSearchParams({
    action: 'query',
    list: 'recentchanges',
    rcnamespace: '0',
    rctype: 'new',
    rcshow: '!redirect',
    rcprop: 'title|timestamp|ids',
    rcstart, rcend,
    rcdir: 'older',
    rclimit: '500',
    format: 'json',
    origin: '*'
  });
  const res = await fetch(`${API(lang)}?${params}`);
  if(!res.ok) throw new Error('network');
  const data = await res.json();
  return data.query ? data.query.recentchanges : [];
}

// Detects the API warning MediaWiki emits when `flagged` isn't a recognized
// prop value — i.e. the wiki doesn't have the FlaggedRevs extension enabled.
// Not every language edition uses it (notably it's common on de/pl/ru/eo
// among others, but absent on en and many smaller wikis), so we check for
// this per response rather than assuming.
function warnsUnsupportedFlagged(data){
  if(!data.warnings) return false;
  try {
    return JSON.stringify(data.warnings).toLowerCase().includes('flagged');
  } catch(e){
    return false;
  }
}

// Maps a raw `flagged` API object to one of three states. A page with no
// `flagged` object at all has never been reviewed. One with `pending_since`
// has a reviewed stable version but newer, not-yet-reviewed edits on top.
// Otherwise it's fully reviewed (current revision == stable revision).
function reviewStatusFromFlagged(flagged){
  if(!flagged) return 'unreviewed';
  return flagged.pending_since ? 'pending' : 'reviewed';
}

// Deleting a page normally drops its creation entry from recentchanges too,
// so this is mostly a safety net for the rare straggler (timing gaps,
// undeletion/redeletion, etc.) rather than the common case. A page the API
// can't resolve by its id comes back with a `missing` key instead of content.
function pageExists(page){
  return !!page && !('missing' in page);
}

async function fetchExtract(lang, pageid){
  const params = new URLSearchParams({
    action: 'query',
    prop: 'extracts|pageimages|info|pageprops|flagged',
    exintro: '1',
    explaintext: '1',
    exsentences: '5',
    piprop: 'thumbnail',
    pithumbsize: '500',
    ppprop: 'wikibase_item',
    inprop: 'url',
    pageids: pageid,
    format: 'json',
    origin: '*'
  });
  const res = await fetch(`${API(lang)}?${params}`);
  const data = await res.json();
  const page = data.query.pages[pageid];
  const reviewStatus = warnsUnsupportedFlagged(data)
    ? null
    : reviewStatusFromFlagged(page.flagged);
  return { page, reviewStatus };
}

// Batch-fetch wikidata item ids and review (FlaggedRevs) status for a list
// of pageids (chunked, since the API caps the number of pageids per request
// for non-bot accounts). Returns flaggedSupported=false if the wiki doesn't
// run the FlaggedRevs extension, so callers can hide review-related UI.
async function fetchPageMetaMap(lang, pageids){
  const wdMap = {};
  const reviewMap = {};
  const existsMap = {};
  let flaggedSupported = true;
  const chunkSize = 50;
  for(let i = 0; i < pageids.length; i += chunkSize){
    const chunk = pageids.slice(i, i + chunkSize);
    const params = new URLSearchParams({
      action: 'query',
      prop: 'pageprops|flagged|info',
      ppprop: 'wikibase_item',
      pageids: chunk.join('|'),
      format: 'json',
      origin: '*'
    });
    try {
      const res = await fetch(`${API(lang)}?${params}`);
      const data = await res.json();
      if(warnsUnsupportedFlagged(data)) flaggedSupported = false;
      if(data.query && data.query.pages){
        for(const pid in data.query.pages){
          const pg = data.query.pages[pid];
          // Missing pages get a negative object key (-1, -2, ...) rather
          // than their real page id, so we key our maps off the echoed-back
          // pg.pageid instead of the raw object key wherever it's present.
          const key = pg.pageid !== undefined ? pg.pageid : pid;
          wdMap[key] = (pg.pageprops && pg.pageprops.wikibase_item) || null;
          reviewMap[key] = reviewStatusFromFlagged(pg.flagged);
          existsMap[key] = pageExists(pg);
        }
      }
    } catch(e){
      // leave this chunk unmapped rather than failing the whole list
    }
  }
  if(!flaggedSupported){
    for(const pid in reviewMap) reviewMap[pid] = null;
  }
  return { wdMap, reviewMap, existsMap, flaggedSupported };
}

function wdBadgeHtml(qid){
  return qid
    ? `<a class="wd-badge linked" href="https://www.wikidata.org/wiki/${qid}" target="_blank" rel="noopener">⬡ Wikidata ${qid}</a>`
    : `<span class="wd-badge unlinked">⬡ no Wikidata item</span>`;
}

// Returns '' (renders nothing) when status is null, i.e. this wiki edition
// doesn't run FlaggedRevs at all, so the badge only ever appears where the
// distinction actually applies.
function reviewBadgeHtml(status){
  if(status === null || status === undefined) return '';
  const variants = {
    reviewed: { cls: 'reviewed', label: '✓ Reviewed' },
    pending: { cls: 'pending', label: '⏳ Pending changes' },
    unreviewed: { cls: 'unreviewed', label: '! Unreviewed' }
  };
  const v = variants[status] || variants.unreviewed;
  return `<span class="review-badge ${v.cls}">${v.label}</span>`;
}

function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function setBusy(isBusy){
  btn.disabled = isBusy;
  listBtn.disabled = isBusy;
}

function noResultsMessage(){
  return `<p class="error">No new articles turned up for this edition around three weeks ago. Smaller wikis sometimes have quiet stretches — try again, or switch editions.</p>`;
}

function pageUrl(lang, title){
  return `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g,'_'))}`;
}

async function dig(){
  const lang = langSel.value;
  setBusy(true);
  stage.className = 'stage';
  stage.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';
  rangeLine.innerHTML = '';
  lastListState = null;
  filterLine.classList.remove('visible');
  reviewFilterWrap.classList.remove('visible');
  noWikidataOnly.checked = false;

  try {
    const selectedWidth = parseInt(rangeWidthSel.value, 10);
    const { candidates, window, widened } = await getCandidates(lang, selectedWidth);
    renderRangeLine(window, widened);
    if(candidates.length === 0){
      stage.innerHTML = noResultsMessage();
      return;
    }

    const pool = [...candidates];
    let pick = null;
    let page = null;
    let reviewStatus = null;
    while(pool.length > 0){
      const idx = Math.floor(Math.random() * pool.length);
      const candidate = pool[idx];
      pool.splice(idx, 1);
      const result = await fetchExtract(lang, candidate.pageid);
      if(pageExists(result.page)){
        pick = candidate;
        page = result.page;
        reviewStatus = result.reviewStatus;
        break;
      }
    }

    if(!page){
      stage.innerHTML = `<p class="error">Every article in this window turned out to have been deleted since. Try a different range or edition.</p>`;
      return;
    }

    const thumb = page.thumbnail
      ? `<img class="thumb" src="${page.thumbnail.source}" alt="">`
      : '';
    const extract = (page.extract || 'No summary available.').trim();
    const url = page.fullurl || pageUrl(lang, page.title);
    const qid = page.pageprops && page.pageprops.wikibase_item;

    stage.innerHTML = `
      <div class="card">
        <div class="stamp">Created ${fmtDate(pick.timestamp)}</div>
        <div class="field">${lang}.wikipedia.org — new article</div>
        <h2 class="title">${page.title}</h2>
        ${thumb}
        <p class="extract">${extract}</p>
        <div class="footer-row">
          <div class="meta-group">
            <span class="meta">page id ${page.pageid}</span>
            ${wdBadgeHtml(qid)}
            ${reviewBadgeHtml(reviewStatus)}
          </div>
          <a class="open" href="${url}" target="_blank" rel="noopener">Read the full article →</a>
        </div>
      </div>
    `;
  } catch(err){
    stage.innerHTML = `<p class="error">Couldn't reach Wikipedia's archive just now. Check your connection and try again.</p>`;
  } finally {
    setBusy(false);
  }
}

function renderList(){
  if(!lastListState) return;
  const { lang, picks, wdMap, reviewMap, deletedCount } = lastListState;
  const onlyMissing = noWikidataOnly.checked;
  const reviewFilterVal = reviewFilterSel.value;
  const filtersActive = onlyMissing || reviewFilterVal !== 'all';

  let visible = picks;
  if(onlyMissing) visible = visible.filter(p => !wdMap[p.pageid]);
  if(reviewFilterVal !== 'all') visible = visible.filter(p => reviewMap[p.pageid] === reviewFilterVal);

  if(visible.length === 0){
    stage.innerHTML = `<p class="error">None of the articles found match those filters — try loosening them.</p>`;
    return;
  }

  const rows = visible.map((p, i) => `
    <li class="list-row">
      <span class="list-index">${String(i + 1).padStart(2,'0')}</span>
      <div class="list-body">
        <a class="list-title-link" href="${pageUrl(lang, p.title)}" target="_blank" rel="noopener">${p.title}</a>
        <div class="list-date">created ${fmtDate(p.timestamp)}</div>
        <div class="badge-row">
          ${wdBadgeHtml(wdMap[p.pageid])}
          ${reviewBadgeHtml(reviewMap[p.pageid])}
        </div>
      </div>
    </li>
  `).join('');

  const countText = filtersActive
    ? `${visible.length} of ${picks.length} found`
    : `${picks.length} found`;

  const deletedNote = deletedCount > 0
    ? `<div class="list-note">${deletedCount} deleted article${deletedCount === 1 ? '' : 's'} filtered out of this window</div>`
    : '';

  stage.innerHTML = `
    <div class="list-card">
      <div class="list-head">
        <span class="field">${lang}.wikipedia.org — new articles</span>
        <span class="list-count">${countText}</span>
      </div>
      ${deletedNote}
      <ul class="list-rows">${rows}</ul>
    </div>
  `;
}

async function listTwenty(){
  const lang = langSel.value;
  setBusy(true);
  stage.className = 'stage wide';
  stage.innerHTML = '<div class="spinner" role="status" aria-label="Loading"></div>';
  rangeLine.innerHTML = '';
  lastListState = null;
  filterLine.classList.remove('visible');
  reviewFilterWrap.classList.remove('visible');

  try {
    const selectedWidth = parseInt(rangeWidthSel.value, 10);
    const { candidates, window, widened } = await getCandidates(lang, selectedWidth);
    renderRangeLine(window, widened);
    if(candidates.length === 0){
      stage.innerHTML = noResultsMessage();
      return;
    }

    const allPicks = [...candidates].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const { wdMap, reviewMap, existsMap, flaggedSupported } = await fetchPageMetaMap(lang, allPicks.map(p => p.pageid));

    const picks = allPicks.filter(p => existsMap[p.pageid] !== false);
    const deletedCount = allPicks.length - picks.length;

    if(picks.length === 0){
      stage.innerHTML = `<p class="error">Every article in this window turned out to have been deleted since. Try a different range or edition.</p>`;
      return;
    }

    lastListState = { lang, picks, wdMap, reviewMap, deletedCount };
    noWikidataOnly.checked = false;
    reviewFilterSel.value = 'all';
    filterLine.classList.add('visible');
    reviewFilterWrap.classList.toggle('visible', flaggedSupported);
    renderList();
  } catch(err){
    stage.innerHTML = `<p class="error">Couldn't reach Wikipedia's archive just now. Check your connection and try again.</p>`;
  } finally {
    setBusy(false);
  }
}

noWikidataOnly.addEventListener('change', renderList);
reviewFilterSel.addEventListener('change', renderList);
btn.addEventListener('click', dig);
listBtn.addEventListener('click', listTwenty);

// Custom date range wiring: filling in both fields overrides the preset
// width dropdown; clearing either field (or hitting the ✕) hands control
// back to it.
const todayStr = new Date().toISOString().slice(0, 10);
customStart.max = todayStr;
customEnd.max = todayStr;
customStart.addEventListener('input', syncRangeControls);
customEnd.addEventListener('input', syncRangeControls);
clearCustomBtn.addEventListener('click', () => {
  customStart.value = '';
  customEnd.value = '';
  syncRangeControls();
});
syncRangeControls();
</script>
